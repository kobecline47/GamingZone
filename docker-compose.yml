services:
  gamingzone-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamingzone-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-gaming.zone.ngrok.pro}
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - ./:/app
    command: ["python", "Main1.py"]
